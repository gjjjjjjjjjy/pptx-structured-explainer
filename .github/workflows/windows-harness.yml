name: Windows harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Sharp SVG backend
        run: npm install sharp --no-save
      - name: Exercise Windows user-font installation
        shell: pwsh
        run: python .\install.py --target codex --codex-dir "$env:RUNNER_TEMP\pptx-skills" --install-fonts
      - name: Diagnose rendering backends
        run: python .\companion\pptx-operator\scripts\render_pptx.py --diagnose
      - name: Run deterministic harness
        shell: pwsh
        run: |
          $output = & python .\tests\run_harness.py 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $message = ($output | Select-Object -Last 80) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows harness failure::$message"
            exit $exitCode
          }
