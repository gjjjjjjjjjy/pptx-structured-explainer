<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>NanoChat 推理执行路径</title>
<desc>从 Prompt 到逐 Token 输出</desc>
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#94A3B8"/>
  </marker>
</defs>
<rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-width="1.5"/>
<text x="72.0" y="76.0" fill="#172033" fill-opacity="1" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="40" font-weight="700" text-anchor="start">NanoChat 推理执行路径</text>
<text x="72.0" y="116.0" fill="#667085" fill-opacity="1" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="20" font-weight="400" text-anchor="start">从 Prompt 到逐 Token 输出</text>
<rect x="72.0" y="440.0" width="280.0" height="180.0" rx="24" fill="#EEF5FF" fill-opacity="1" stroke="#2F80ED" stroke-width="2" filter="url(#softShadow)"/>
<circle cx="106.0" cy="474.0" r="17.0" fill="#2F80ED" stroke="none" stroke-width="1.5"/>
<text x="106.0" y="481.0" fill="#FFFFFF" fill-opacity="1" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="17" font-weight="700" text-anchor="middle">1</text>
<text x="100.0" y="522.0" fill="#172033" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="100.0" dy="0.0">Prompt</tspan></text>
<text x="100.0" y="568.0" fill="#667085" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="100.0" dy="0.0">输入 Token 序列</tspan></text>
<rect x="406.0" y="440.0" width="280.0" height="180.0" rx="24" fill="#EAF8F3" fill-opacity="1" stroke="#168A68" stroke-width="2" filter="url(#softShadow)"/>
<circle cx="440.0" cy="474.0" r="17.0" fill="#168A68" stroke="none" stroke-width="1.5"/>
<text x="440.0" y="481.0" fill="#FFFFFF" fill-opacity="1" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="17" font-weight="700" text-anchor="middle">2</text>
<text x="434.0" y="522.0" fill="#172033" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="434.0" dy="0.0">Prefill</tspan></text>
<text x="434.0" y="568.0" fill="#667085" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="434.0" dy="0.0">并行计算并写入历史 K / V</tspan></text>
<rect x="740.0" y="440.0" width="280.0" height="180.0" rx="24" fill="#F2EEFF" fill-opacity="1" stroke="#7C4DFF" stroke-width="2" filter="url(#softShadow)"/>
<circle cx="774.0" cy="474.0" r="17.0" fill="#7C4DFF" stroke="none" stroke-width="1.5"/>
<text x="774.0" y="481.0" fill="#FFFFFF" fill-opacity="1" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="17" font-weight="700" text-anchor="middle">3</text>
<text x="768.0" y="522.0" fill="#172033" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="768.0" dy="0.0">Decode</tspan></text>
<text x="768.0" y="568.0" fill="#667085" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="768.0" dy="0.0">读取 Cache，逐 Token 生成</tspan></text>
<rect x="1074.0" y="440.0" width="280.0" height="180.0" rx="24" fill="#FFF6E8" fill-opacity="1" stroke="#F59E0B" stroke-width="2" filter="url(#softShadow)"/>
<circle cx="1108.0" cy="474.0" r="17.0" fill="#F59E0B" stroke="none" stroke-width="1.5"/>
<text x="1108.0" y="481.0" fill="#FFFFFF" fill-opacity="1" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="17" font-weight="700" text-anchor="middle">4</text>
<text x="1102.0" y="522.0" fill="#172033" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="1102.0" dy="0.0">Output</tspan></text>
<text x="1102.0" y="568.0" fill="#667085" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="1102.0" dy="0.0">返回生成 Token</tspan></text>
<line x1="362.0" y1="530.0" x2="394.0" y2="530.0" stroke="#94A3B8" stroke-width="3" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="696.0" y1="530.0" x2="728.0" y2="530.0" stroke="#94A3B8" stroke-width="3" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="713.0" y="512.0" fill="#667085" fill-opacity="1" font-family="Arial, &#x27;Microsoft YaHei&#x27;, &#x27;PingFang SC&#x27;, sans-serif" font-size="16" font-weight="400" text-anchor="middle">KV Cache</text>
<line x1="1030.0" y1="530.0" x2="1062.0" y2="530.0" stroke="#94A3B8" stroke-width="3" stroke-opacity="1" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>