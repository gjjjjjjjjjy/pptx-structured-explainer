<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>SVG绘图模式选择图</title>
  <desc>比较Structured、Hybrid和Custom三种绘图模式，并说明用户可以统一选择或逐图选择。</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#F8F3FF"/>
    </linearGradient>
    <linearGradient id="hybrid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF8F3"/><stop offset="1" stop-color="#F6F0FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <rect width="1600" height="144" fill="url(#top)"/>
  <rect x="72" y="48" width="10" height="60" rx="5" fill="#6A1B9A"/>
  <text x="104" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="39" font-weight="700" fill="#172033">选择 SVG 绘图模式</text>
  <text x="104" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#667085">用户决定生成自由度；三种模式共用严格校验、非浏览器预览和 PowerPoint 嵌入流程</text>
  <rect x="1284" y="48" width="244" height="50" rx="25" fill="#172033"/>
  <text x="1406" y="80" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">也可选择：逐图判断</text>

  <rect x="64" y="180" width="464" height="486" rx="26" fill="#FFFFFF" stroke="#BDD3F4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="64" y="180" width="464" height="86" rx="26" fill="#EAF2FF"/>
  <rect x="64" y="240" width="464" height="26" fill="#EAF2FF"/>
  <circle cx="108" cy="223" r="23" fill="#2F7FF7"/><text x="108" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
  <text x="146" y="220" font-family="Arial, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172033">Structured</text>
  <text x="146" y="248" font-family="PingFang SC, sans-serif" font-size="18" fill="#1D5FC4">稳定模式 · 结构化 JSON 自动排版</text>
  <rect x="92" y="302" width="114" height="62" rx="14" fill="#F1F5F9" stroke="#C8D5E5"/>
  <text x="149" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#475467">JSON</text>
  <path d="M214 333H265" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="276" y="302" width="114" height="62" rx="14" fill="#EAF2FF" stroke="#8DB8FA"/>
  <text x="333" y="328" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#1D5FC4">布局</text>
  <text x="333" y="350" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" fill="#1D5FC4">引擎</text>
  <path d="M398 333H449" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="456" y="302" width="46" height="62" rx="12" fill="#DCEAFF" stroke="#2F7FF7"/>
  <text x="479" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1D5FC4">SVG</text>
  <line x1="92" y1="396" x2="500" y2="396" stroke="#E2E8F0"/>
  <text x="92" y="435" font-family="PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#172033">适合</text>
  <text x="92" y="470" font-family="PingFang SC, sans-serif" font-size="18" fill="#475467">流程图、任务树、时间线、对比、矩阵</text>
  <text x="92" y="504" font-family="PingFang SC, sans-serif" font-size="18" fill="#475467">弱模型、大批量、强一致性输出</text>
  <rect x="92" y="542" width="408" height="78" rx="16" fill="#F4F8FE"/>
  <text x="116" y="574" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#1D5FC4">主要优势</text>
  <text x="116" y="602" font-family="PingFang SC, sans-serif" font-size="17" fill="#475467">不让模型直接猜坐标，稳定且易批量修改</text>

  <rect x="568" y="180" width="464" height="486" rx="26" fill="#FFFFFF" stroke="#C9B8E6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="568" y="180" width="464" height="86" rx="26" fill="url(#hybrid)"/>
  <rect x="568" y="240" width="464" height="26" fill="url(#hybrid)"/>
  <circle cx="612" cy="223" r="23" fill="#15936F"/><text x="612" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
  <text x="650" y="220" font-family="Arial, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172033">Hybrid</text>
  <text x="650" y="248" font-family="PingFang SC, sans-serif" font-size="18" fill="#116B54">混合模式 · 稳定底图 + 局部机制精绘</text>
  <rect x="598" y="302" width="120" height="62" rx="14" fill="#EAF8F3" stroke="#84CDB6"/>
  <text x="658" y="328" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#116B54">结构化</text>
  <text x="658" y="350" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" fill="#116B54">底图</text>
  <text x="750" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#94A3B8">+</text>
  <rect x="782" y="302" width="120" height="62" rx="14" fill="#F7F0FF" stroke="#B68ADC"/>
  <text x="842" y="328" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#6A1B9A">自定义</text>
  <text x="842" y="350" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" fill="#6A1B9A">机制层</text>
  <path d="M912 333H962" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="970" y="302" width="38" height="62" rx="12" fill="#ECE7F6" stroke="#6A1B9A"/>
  <text x="989" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6A1B9A">SVG</text>
  <line x1="596" y1="396" x2="1004" y2="396" stroke="#E2E8F0"/>
  <text x="596" y="435" font-family="PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#172033">适合</text>
  <text x="596" y="470" font-family="PingFang SC, sans-serif" font-size="18" fill="#475467">标准流程中嵌入 Mask、公式或状态变化</text>
  <text x="596" y="504" font-family="PingFang SC, sans-serif" font-size="18" fill="#475467">既要批量一致，又有少量复杂知识点</text>
  <rect x="596" y="542" width="408" height="78" rx="16" fill="#F6FAF8"/>
  <text x="620" y="574" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#116B54">主要优势</text>
  <text x="620" y="602" font-family="PingFang SC, sans-serif" font-size="17" fill="#475467">复杂部分局部增强，不破坏整体版式稳定性</text>

  <rect x="1072" y="180" width="464" height="486" rx="26" fill="#FFFFFF" stroke="#E0C2A1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1072" y="180" width="464" height="86" rx="26" fill="#FFF4E8"/>
  <rect x="1072" y="240" width="464" height="26" fill="#FFF4E8"/>
  <circle cx="1116" cy="223" r="23" fill="#F79009"/><text x="1116" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
  <text x="1154" y="220" font-family="Arial, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172033">Custom</text>
  <text x="1154" y="248" font-family="PingFang SC, sans-serif" font-size="18" fill="#B95F00">精绘模式 · 直接控制完整 SVG 构图</text>
  <path d="M1104 348C1154 292 1208 382 1252 326S1348 292 1392 342S1464 374 1500 312" fill="none" stroke="#F79009" stroke-width="5"/>
  <circle cx="1104" cy="348" r="10" fill="#F79009"/><circle cx="1252" cy="326" r="10" fill="#6A1B9A"/><circle cx="1392" cy="342" r="10" fill="#2F7FF7"/><circle cx="1500" cy="312" r="10" fill="#15936F"/>
  <rect x="1160" y="302" width="74" height="50" rx="12" fill="#F7F0FF" stroke="#B68ADC"/>
  <rect x="1320" y="354" width="92" height="50" rx="12" fill="#EAF2FF" stroke="#8DB8FA"/>
  <line x1="1100" y1="420" x2="1508" y2="420" stroke="#E2E8F0"/>
  <text x="1100" y="459" font-family="PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#172033">适合</text>
  <text x="1100" y="494" font-family="PingFang SC, sans-serif" font-size="18" fill="#475467">模型架构、Attention 计算、复杂机制</text>
  <text x="1100" y="528" font-family="PingFang SC, sans-serif" font-size="18" fill="#475467">代表页、品牌化表达和高精度构图</text>
  <rect x="1100" y="556" width="408" height="64" rx="16" fill="#FFF8F0"/>
  <text x="1124" y="583" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#B95F00">主要优势</text>
  <text x="1124" y="607" font-family="PingFang SC, sans-serif" font-size="17" fill="#475467">表达自由度最高，可按知识拓扑定制画面</text>

  <rect x="64" y="708" width="1472" height="128" rx="24" fill="#172033"/>
  <text x="96" y="750" font-family="PingFang SC, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">用户可以怎么选？</text>
  <rect x="318" y="728" width="242" height="88" rx="18" fill="#263449"/>
  <text x="439" y="762" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#78ADFF">整套统一模式</text>
  <text x="439" y="792" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" fill="#CBD5E1">适合风格和结构高度一致</text>
  <text x="594" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#64748B">或</text>
  <rect x="628" y="728" width="302" height="88" rx="18" fill="#263449" stroke="#4D9AFF"/>
  <text x="779" y="762" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">逐图选择（推荐）</text>
  <text x="779" y="792" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="17" fill="#CBD5E1">常规页稳定生成，机制页精细表达</text>
  <path d="M944 772H1010" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1026" y="728" width="478" height="88" rx="18" fill="#263449"/>
  <text x="1054" y="762" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">选择发生在：统一风格样张之前</text>
  <text x="1054" y="792" font-family="PingFang SC, sans-serif" font-size="17" fill="#CBD5E1">用户可覆盖推荐，三种模式均执行相同 QA</text>
</svg>
